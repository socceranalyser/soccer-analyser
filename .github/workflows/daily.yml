name: daily-update

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 10:00 Baku
  workflow_dispatch: {}       # "Run workflow" button for a manual run

permissions:
  contents: write             # to save data/state back to the repository

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Baku
      PYTHONPATH: ${{ github.workspace }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache downloaded football data
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/matches.pkl
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-
      - run: python scripts/cloud_job.py
      - name: Save forecasts and coupons back to the repository
        run: |
          git config user.name "soccer-analyser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state data/misli_results.csv data/nat_calibration.json data/euro_name_map.csv
          git diff --cached --quiet || git commit -m "daily state $(date +%F)" && git push
