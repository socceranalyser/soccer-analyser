name: live-collect

# Snapshots of all football matches in play (minute, score, cards, misli.az live odds,
# livescore statistics) -> branch 'livedata' (keeps the dashboard from redeploying).
# GitHub drops/delays frequent schedules (*/15 never fired), so each run is a long job:
# started 4 times a day, it loops ~5h50m taking a snapshot every 10 minutes.
on:
  schedule:
    - cron: "7 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: livedata
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy requests tzdata
      - name: Collect every 10 minutes for ~5h50m
        env:
          PYTHONPATH: ${{ github.workspace }}/code
          # goal alerts for starred matches (stars are read from the private Telegram backup)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd store
          git config user.name "soccer-analyser-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python ../code/scripts/collect_live.py --out live || true
            git add live
            if ! git diff --cached --quiet; then
              git commit -q -m "live snapshot $(date -u +%FT%H:%M)"
              git pull -q --rebase || true
              git push -q || true
            fi
            # between snapshots: a quick score check every minute for goal alerts
            for i in 1 2 3 4 5 6 7 8 9; do
              sleep 60
              python ../code/scripts/collect_live.py --out live --goals-only || true
            done
            sleep 50
          done
